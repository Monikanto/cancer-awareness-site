<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancer Awareness & Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
    <section class="landing">
        <img src="assets/banner.jpg" alt="Cancer Awareness Banner">
        <h1>Cancer Awareness & Support</h1>
        <p>Together we spread awareness, support the fighters and inspire hope.</p>
    </section>

 
    <section class="quotes">
        <h2>Inspirational Quote</h2>
        <div id="quoteText">Loading quote...</div>
        <div id="quoteAuthor"></div>
        <button class="quote-btn" id="newQuoteBtn">Get New Quote</button>
    </section>

 
    <section class="contact-section">
        <h2>Contact Us</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
